<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日语单词攒钱计划</title>
    <style>
        :root { --primary:#2A6F38; --secondary:#7FC590; --bg:#F2F9F4; --text:#333; --white:#fff; --danger:#E57373; }
        *{box-sizing:border-box}
        body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);margin:0;display:flex;flex-direction:column;align-items:center}
        .container{width:100%;max-width:500px;min-height:100vh;padding:20px}
        .page{display:none}.page.active{display:flex;flex-direction:column}
        .card{background:var(--white);border-radius:18px;padding:25px;margin-bottom:20px}
        h1,h2{color:var(--primary);text-align:center}
        .slogan{text-align:center;color:#666}
        button{width:100%;padding:16px;border-radius:12px;background:var(--secondary);color:white;border:none;font-weight:bold;margin-bottom:12px}
        button.danger{background:var(--danger)}
        button.outline{background:transparent;border:2px solid var(--secondary);color:var(--secondary)}
        button:disabled{background:#ccc}
        .word-display{font-size:32px;text-align:center;color:var(--primary);margin:20px 0}
        .word-info{border-top:1px solid #eee;padding-top:15px}
        .progress-bar{height:6px;background:#eee;border-radius:3px;margin-bottom:20px}
        .progress-fill{height:100%;background:var(--secondary)}
        .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
        .stat-box{background:white;padding:15px;border-radius:12px;text-align:center}
        .calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
        .cal-day{aspect-ratio:1;background:#eee;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px}
        .cal-10{background:#c8e6c9}
        .cal-20{background:#81c784}
        .cal-30{background:#2e7d32;color:white}
        .cal-today{border:2px solid var(--primary)}
        .toast{position:fixed;bottom:30px;left:50%;transform:translate(-50%,50px);background:#2A6F38;color:white;padding:10px 20px;border-radius:8px;opacity:0}
        .toast.show{transform:translate(-50%,0);opacity:1}
    </style>
</head>
<body>

<div class="container">
    <div id="homePage" class="page active">
        <div class="card">
            <h1>日语单词攒钱计划</h1>
            <p class="slogan" id="slogan"></p>
            <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:20px 0">
                <button class="book-btn" onclick="select('n1')">N1</button>
                <button class="book-btn" onclick="select('n2')">N2</button>
                <button class="book-btn" onclick="select('n3')">N3</button>
                <button class="book-btn" onclick="select('n4')">N4</button>
                <button class="book-btn" onclick="select('n5')">N5</button>
            </div>
            <button id="study" disabled onclick="startStudy()">学习新单词</button>
            <button id="review" disabled onclick="startReview()">复习单词</button>
            <button class="danger" onclick="openStats()">💰 攒钱进度</button>
        </div>
    </div>

    <div id="studyPage" class="page">
        <div class="card">
            <div class="word-display" id="word"></div>
            <div class="word-info">
                <div>发音：<span id="read"></span></div>
                <div>释义：<span id="mean"></span></div>
            </div>
            <button onclick="next()">记住了</button>
            <button class="outline" onclick="back()">返回</button>
        </div>
    </div>

    <div id="statsPage" class="page">
        <div class="card">
            <h2>💰 攒钱进度</h2>
            <div class="stat-grid">
                <div class="stat-box">今日：<span id="d">0</span></div>
                <div class="stat-box">总计：<span id="t">0</span></div>
            </div>
            <br>
            <button onclick="goHome()">返回</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
let book = "";
let user = JSON.parse(localStorage.getItem("jp"))||{daily:{},total:0};

// 随机标语
const slogans = ["背一个单词，存一笔财富🤑","今天努力，明天存款✨","单词背得稳，小钱攒得准💰"];
document.getElementById("slogan").innerText = slogans[Math.floor(Math.random()*slogans.length)];

// 选择单词本
function select(b){
    book=b;
    document.getElementById("study").disabled=false;
    document.getElementById("review").disabled=false;
    show("已选择："+b);
}

// 学习
function startStudy(){ showPage("studyPage"); setWord(); }
function startReview(){ showPage("studyPage"); setWord(); }
function setWord(){ document.getElementById("word").textContent="テスト"; document.getElementById("read").textContent="test"; document.getElementById("mean").textContent="测试"; }
function next(){ setWord(); }
function back(){ showPage("homePage"); }

// 攒钱进度 —— 100% 可打开
function openStats(){
    const today = new Date().toISOString().split('T')[0];
    document.getElementById("d").innerText = user.daily[today]||0;
    document.getElementById("t").innerText = user.total||0;
    showPage("statsPage");
}

// 页面切换
function showPage(id){
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}
function goHome(){ showPage("homePage"); }

// 提示
function show(m){
    const t=document.getElementById("toast");
    t.textContent=m;
    t.classList.add("show");
    setTimeout(()=>t.classList.remove("show"),1500);
}
</script>
</body>
</html>
