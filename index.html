<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日语单词攒钱计划</title>
    <style>
        :root {
            --primary: #2A6F38;
            --secondary: #7FC590;
            --bg: #F2F9F4;
            --text: #333;
            --white: #ffffff;
            --danger: #E57373;
        }
        *{box-sizing:border-box}
        body{
            font-family:system-ui, sans-serif;
            background:var(--bg);
            margin:0;
            display:flex;
            justify-content:center;
        }
        .container{
            width:100%;
            max-width:500px;
            padding:20px;
        }
        .page{display:none}
        .page.active{display:block}
        .card{
            background:white;
            border-radius:18px;
            padding:25px;
            margin-bottom:20px;
        }
        h1,h2{color:var(--primary);text-align:center}
        .slogan{text-align:center;color:#666}
        button{
            width:100%;
            padding:16px;
            border-radius:12px;
            background:var(--secondary);
            color:white;
            border:none;
            font-weight:bold;
            margin-bottom:10px;
        }
        button.danger{background:var(--danger)}
        button.outline{background:transparent;border:2px solid var(--secondary);color:var(--secondary)}
        button:disabled{background:#ccc}
        .book-grid{
            display:grid;
            grid-template-columns:repeat(5,1fr);
            gap:8px;
            margin:20px 0;
        }
        .book-btn{padding:10px;background:#f0f8f2;border:1px solid #ddd}
        .book-btn.active{background:var(--secondary);color:white}
        .word-display{font-size:32px;text-align:center;margin:20px 0;color:var(--primary)}
        .word-info{border-top:1px solid #eee;padding-top:15px}
        .info-item{margin-bottom:8px}
        .progress-bar{height:6px;background:#eee;border-radius:3px;margin-bottom:20px}
        .progress-fill{height:100%;background:var(--secondary);width:0}
        .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
        .stat-box{background:white;padding:15px;border-radius:12px;text-align:center}
        .calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
        .cal-day{aspect-ratio:1;background:#eee;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px}
        .cal-10{background:#c8e6c9}
        .cal-20{background:#81c784}
        .cal-30{background:#2e7d32;color:white}
        .cal-today{border:2px solid var(--primary)}
        .toast{position:fixed;bottom:30px;left:50%;transform:translate(-50%,50px);background:#2A6F38;color:white;padding:10px 20px;border-radius:8px;opacity:0;transition:0.3s}
        .toast.show{transform:translate(-50%,0);opacity:1}
        .spell-input{width:100%;padding:15px;border:2px solid #eee;border-radius:12px;margin-bottom:20px;text-align:center}
    </style>
</head>
<body>

<div class="container">
    <!-- 首页 -->
    <div id="homePage" class="page active">
        <div class="card">
            <h1>日语单词攒钱计划</h1>
            <p class="slogan" id="slogan">背一个单词，存一笔财富 🤑</p>
            <div class="book-grid">
                <button class="book-btn" onclick="selectBook('n1','N1')">N1</button>
                <button class="book-btn" onclick="selectBook('n2','N2')">N2</button>
                <button class="book-btn" onclick="selectBook('n3','N3')">N3</button>
                <button class="book-btn" onclick="selectBook('n4','N4')">N4</button>
                <button class="book-btn" onclick="selectBook('n5','N5')">N5</button>
            </div>
            <p style="text-align:center" id="currentBook">未选择单词本</p>
            <button id="start" disabled onclick="startStudy()">📖 开始学习</button>
            <button class="danger" onclick="openStats()">💰 攒钱进度</button>
        </div>
    </div>

    <!-- 学习页 -->
    <div id="studyPage" class="page">
        <div class="card">
            <h2>学习中</h2>
            <div class="progress-bar"><div class="progress-fill" id="prog"></div></div>
            <div class="word-display" id="word"></div>
            <div class="word-info">
                <div class="info-item">发音：<span id="read"></span></div>
                <div class="info-item">释义：<span id="mean"></span></div>
            </div>
            <button onclick="nextWord(true)">✅ 记住了</button>
            <button class="outline" onclick="nextWord(false)">🔄 没记住</button>
            <button class="danger" onclick="goHome()">← 返回</button>
        </div>
    </div>

    <!-- 完成页 -->
    <div id="finishPage" class="page">
        <div class="card">
            <h2>本轮学习完成</h2>
            <button onclick="startSpell()">拼写测试</button>
            <button onclick="showSummary()">学习小结</button>
            <button onclick="goHome()">返回主页</button>
        </div>
    </div>

    <!-- 拼写页 -->
    <div id="spellPage" class="page">
        <div class="card">
            <h2>拼写测试</h2>
            <div class="progress-bar"><div class="progress-fill" id="spellProg"></div></div>
            <p id="hint"></p>
            <input class="spell-input" id="spellInput">
            <button onclick="checkSpell()">提交</button>
        </div>
    </div>

    <!-- 小结 -->
    <div id="summaryPage" class="page">
        <div class="card">
            <h2>学习小结</h2>
            <div id="sumList"></div>
            <button onclick="goHome()">完成</button>
        </div>
    </div>

    <!-- 攒钱进度 -->
    <div id="statsPage" class="page">
        <div class="card">
            <h2>💰 攒钱进度</h2>
            <div class="stat-grid">
                <div class="stat-box">今日：<span id="d">0</span></div>
                <div class="stat-box">总计：<span id="t">0</span></div>
                <div class="stat-box">今日收益：<span id="dm">0</span> 元</div>
                <div class="stat-box">总收益：<span id="tm">0</span> 元</div>
            </div>
            <br>
            <h3 style="font-size:16px">学习日历</h3>
            <div class="calendar" id="cal"></div>
            <br>
            <button onclick="goHome()">返回</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// 全局数据
let book = "";
let words = [];
let idx = 0;
let learned = [];
const BATCH = 10;
const PRICE = 0.1;

let user = JSON.parse(localStorage.getItem("jp")) || {
  daily:{}, total:0, records:[]
};

// 加载单词本
async function loadBook(bk){
  try{
    let r = await fetch(`./${bk}.json`);
    return await r.json();
  }catch(e){
    return [];
  }
}

// 选择单词本
async function selectBook(bk, name){
  book = bk;
  document.getElementById("currentBook").innerText = "当前："+name;
  words = await loadBook(bk);
  document.getElementById("start").disabled = false;
  showToast("已选择："+name);
}

// 开始学习
function startStudy(){
  if(words.length===0){showToast("单词为空");return}
  let shuffled = [...words].sort(()=>Math.random()-0.5).slice(0,BATCH);
  window.batch = shuffled;
  idx = 0;
  learned = [];
  showWord();
  showPage("studyPage");
}

// 显示单词
function showWord(){
  let w = window.batch[idx];
  document.getElementById("word").innerText = w.word;
  document.getElementById("read").innerText = w.reading;
  document.getElementById("mean").innerText = w.meaning;
  document.getElementById("prog").style.width = (idx/BATCH*100)+"%";
}

// 下一个
function nextWord(ok){
  learned.push({word:window.batch[idx].word, ok:ok});
  idx++;
  if(idx >= BATCH){
    saveStudy();
    showPage("finishPage");
    return;
  }
  showWord();
}

// 保存学习记录
function saveStudy(){
  let today = new Date().toISOString().split('T')[0];
  user.daily[today] = (user.daily[today]||0) + BATCH;
  user.total += BATCH;
  user.records.push({date:today, count:BATCH});
  localStorage.setItem("jp", JSON.stringify(user));
}

// 拼写测试
function startSpell(){
  window.spellList = [...window.batch];
  window.spellIdx = 0;
  showSpell();
  showPage("spellPage");
}

function showSpell(){
  if(spellIdx >= spellList.length){
    showToast("测试完成！");
    goHome();
    return;
  }
  let w = spellList[spellIdx];
  document.getElementById("hint").innerText = "意思："+w.meaning;
  document.getElementById("spellInput").value = "";
  document.getElementById("spellProg").style.width = (spellIdx/spellList.length*100)+"%";
}

function checkSpell(){
  let val = document.getElementById("spellInput").value.trim();
  let target = spellList[spellIdx];
  if(val === target.word || val === target.reading){
    showToast("正确！");
  }else{
    showToast("答案："+target.word);
  }
  spellIdx++;
  showSpell();
}

// 学习小结
function showSummary(){
  let html = "";
  learned.forEach(item=>{
    html += `<p>${item.word} —— ${item.ok?"✅ 掌握":"❌ 未掌握"}</p>`;
  });
  document.getElementById("sumList").innerHTML = html;
  showPage("summaryPage");
}

// 攒钱进度
function openStats(){
  let today = new Date().toISOString().split('T')[0];
  document.getElementById("d").innerText = user.daily[today]||0;
  document.getElementById("t").innerText = user.total||0;
  document.getElementById("dm").innerText = ((user.daily[today]||0)*PRICE).toFixed(1);
  document.getElementById("tm").innerText = (user.total*PRICE).toFixed(1);
  renderCal();
  showPage("statsPage");
}

// 日历渲染
function renderCal(){
  let cal = document.getElementById("cal");
  cal.innerHTML = "";
  let now = new Date();
  let year = now.getFullYear();
  let month = now.getMonth();
  let first = new Date(year,month,1).getDay()||7;
  let days = new Date(year,month+1,0).getDate();

  for(let i=1;i<first;i++){
    let e = document.createElement("div");
    cal.appendChild(e);
  }
  for(let day=1;day<=days;day++){
    let e = document.createElement("div");
    e.className = "cal-day";
    e.innerText = day;
    let key = `${year}-${String(month+1).padStart(2,0)}-${String(day).padStart(2,0)}`;
    let cnt = user.daily[key]||0;
    if(cnt>=10 && cnt<20) e.classList.add("cal-10");
    if(cnt>=20 && cnt<30) e.classList.add("cal-20");
    if(cnt>=30) e.classList.add("cal-30");
    if(day===now.getDate()) e.classList.add("cal-today");
    cal.appendChild(e);
  }
}

// 页面切换
function showPage(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
function goHome(){ showPage("homePage"); }

// 提示
function showToast(m){
  let t = document.getElementById("toast");
  t.innerText = m;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),1500);
}
</script>
</body>
</html>
