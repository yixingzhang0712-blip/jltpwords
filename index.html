<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日语单词攒钱计划</title>
    <style>
        :root {
            --primary: #2A6F38;
            --light: #A5D6A7;
            --medium: #66BB6A;
            --dark: #2E7D32;
            --bg: #F2F9F4;
            --white: #fff;
            --danger: #E57373;
        }
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, sans-serif;
            background: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }
        .page { display: none; }
        .page.active { display: block; }
        .card {
            background: var(--white);
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 16px;
        }
        h1, h2 {
            color: var(--primary);
            text-align: center;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: var(--primary);
            color: white;
            font-size: 16px;
            margin-bottom: 10px;
        }
        button.outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }
        button.quiet {
            background: #f1f1f1;
            color: #333;
        }
        .word {
            font-size: 32px;
            text-align: center;
            margin: 20px 0;
            color: var(--primary);
            cursor: pointer;
        }
        .info {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 10px;
        }
        .section {
            margin: 12px 0;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        .progress {
            height: 6px;
            background: #eee;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .progress-bar {
            height: 100%;
            background: var(--primary);
        }

        /* 日历 */
        .week-row {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: bold;
            font-size: 12px;
            color: var(--primary);
            margin-bottom: 4px;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            font-size: 12px;
        }
        .day-10 { background: #A5D6A7; color: #000; }
        .day-20 { background: #66BB6A; color: #fff; }
        .day-30 { background: #2E7D32; color: #fff; }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translate(-50%, 50px);
            background: var(--primary);
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            opacity: 0;
            transition: 0.3s;
        }
        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 主页 -->
    <div id="home" class="page active">
        <div class="card">
            <h1>日语单词攒钱计划</h1>
            <button onclick="selectLevel('n5')">N5</button>
            <button onclick="selectLevel('n4')">N4</button>
            <button onclick="selectLevel('n3')">N3</button>
            <button onclick="selectLevel('n2')">N2</button>
            <button onclick="selectLevel('n1')">N1</button>
            <button class="outline" onclick="go('stats')">📊 学习统计</button>
        </div>
    </div>

    <!-- 学习页 -->
    <div id="study" class="page">
        <div class="card">
            <div class="progress"><div class="progress-bar" id="prog"></div></div>
            <div class="word" id="word" onclick="editNote()"></div>
            <div class="info">发音：<span id="reading"></span></div>
            <div class="info">释义：<span id="meaning"></span></div>
            <div class="info">搭配：<span id="note"></span></div>
            <button onclick="next(true)">记住了</button>
            <button class="quiet" onclick="next(false)">未记住</button>
        </div>
    </div>

    <!-- 学习后选择 -->
    <div id="finish" class="page">
        <div class="card">
            <h2>本轮学习完成</h2>
            <button onclick="startSpell()">拼写测试</button>
            <button class="outline" onclick="showSummary()">学习小结</button>
            <button class="quiet" onclick="go('home')">返回主页</button>
        </div>
    </div>

    <!-- 拼写测试 -->
    <div id="spell" class="page">
        <div class="card">
            <div class="progress"><div class="progress-bar" id="spellProg"></div></div>
            <div id="spellQ"></div>
            <input id="spellInput" placeholder="输入单词">
            <button onclick="checkSpell()">提交</button>
        </div>
    </div>

    <!-- 小结 -->
    <div id="summary" class="page">
        <div class="card">
            <h2>学习小结</h2>
            <div id="sumList"></div>
            <button onclick="go('home')">完成</button>
        </div>
    </div>

    <!-- 统计 + 日历 -->
    <div id="stats" class="page">
        <div class="card">
            <h2>学习统计</h2>
            <div class="section">今日学习：<span id="todayCount"></span> 词</div>
            <div class="section">历史总学习：<span id="totalCount"></span> 词</div>
            <div class="section">今日收益：<span id="todayCoin"></span> 元</div>
            <div class="section">总收益：<span id="totalCoin"></span> 元</div>

            <h3>学习日历</h3>
            <div class="week-row">
                <div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div>
            </div>
            <div class="calendar-grid" id="calendar"></div>

            <button onclick="go('home')">返回</button>
        </div>
    </div>

    <!-- 编辑搭配 -->
    <div id="editor" class="page">
        <div class="card">
            <h2>编辑搭配/例句</h2>
            <textarea id="noteEditor" style="width:100%;height:100px;padding:8px;"></textarea>
            <button onclick="saveNote()">保存</button>
            <button class="quiet" onclick="go('study')">取消</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>
</div>

<script>
// ==========================================
// 数据
// ==========================================
const words = { n1:[],n2:[],n3:[],n4:[],n5:[] };
const storage = JSON.parse(localStorage.getItem("jpData") || `{
  "learned":{}, "notes":{}, "daily":{}, "total":0
}`);

let currentLevel = "";
let currentList = [];
let index = 0;
let spellList = [];
let spellStatus = {};

// ==========================================
// 工具
// ==========================================
function $(id) { return document.getElementById(id) }
function go(page) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  $(page).classList.add("active");
}
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1800);
}
function today() {
  return new Date().toISOString().split("T")[0];
}

// ==========================================
// 加载 JSON
// ==========================================
async function loadAll() {
  for (let i=1; i<=5; i++) {
    const l = `n${i}`;
    try {
      const res = await fetch(`./${l}.json`);
      words[l] = await res.json();
    } catch(e) {}
  }
}

// ==========================================
// 选择等级
// ==========================================
function selectLevel(l) {
  currentLevel = l;
  currentList = [...words[l]].sort(()=>Math.random()-0.5).slice(0,10);
  index = 0;
  renderStudy();
  go("study");
}

// ==========================================
// 学习页
// ==========================================
function renderStudy() {
  const w = currentList[index];
  $("word").textContent = w.word;
  $("reading").textContent = w.reading;
  $("meaning").textContent = w.meaning;
  $("note").textContent = storage.notes[w.word] || "未设置";
  $("prog").style.width = (index/currentList.length*100)+"%";
}

function next(ok) {
  const w = currentList[index].word;
  storage.learned[w] = ok;
  storage.total++;
  storage.daily[today()] = (storage.daily[today()]||0)+1;
  localStorage.setItem("jpData", JSON.stringify(storage));

  index++;
  if (index >= currentList.length) {
    go("finish");
    return;
  }
  renderStudy();
}

// ==========================================
// 编辑搭配
// ==========================================
function editNote() {
  const w = currentList[index].word;
  $("noteEditor").value = storage.notes[w] || "";
  go("editor");
}
function saveNote() {
  const w = currentList[index].word;
  storage.notes[w] = $("noteEditor").value;
  localStorage.setItem("jpData", JSON.stringify(storage));
  renderStudy();
  go("study");
  toast("已保存");
}

// ==========================================
// 小结
// ==========================================
function showSummary() {
  let ok = 0, no = 0;
  let html = "";
  currentList.forEach(w => {
    const b = storage.learned[w.word];
    if (b) ok++; else no++;
    html += `<div>${w.word}：${b?"✅ 掌握":"❌ 未掌握"}</div>`;
  });
  $("sumList").innerHTML = `<div>掌握：${ok} 个 | 未掌握：${no} 个</div><br>` + html;
  go("summary");
}

// ==========================================
// 拼写测试
// ==========================================
function startSpell() {
  spellList = [...currentList];
  spellStatus = {};
  spellRound();
}
function spellRound() {
  if (spellList.length === 0) {
    toast("拼写测试通关！");
    go("home");
    return;
  }
  const q = spellList[0];
  $("spellQ").textContent = q.meaning;
  $("spellInput").value = "";
  $("spellProg").style.width = ((10 - spellList.length) / 10 * 100) + "%";
  go("spell");
}
function checkSpell() {
  const q = spellList[0];
  const val = $("spellInput").value.trim();
  const ok = (val === q.word || val === q.reading);

  if (!spellStatus[q.word]) spellStatus[q.word] = 0;

  if (ok) {
    spellStatus[q.word]++;
    if (spellStatus[q.word] === 1) {
      spellList.shift();
      toast("正确！");
    } else if (spellStatus[q.word] === 2) {
      spellList.shift();
      toast("已纠正！");
    }
  } else {
    spellStatus[q.word] = -1;
    toast("错误，请再试一次");
  }
  spellRound();
}

// ==========================================
// 统计 & 真实日历
// ==========================================
function renderStats() {
  const td = today();
  const tcount = storage.daily[td] || 0;
  const total = storage.total;
  $("todayCount").textContent = tcount;
  $("totalCount").textContent = total;
  $("todayCoin").textContent = Math.floor(tcount / 10);
  $("totalCoin").textContent = Math.floor(total / 10);

  // 真实日历
  const cal = $("calendar");
  cal.innerHTML = "";
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth();
  const first = new Date(year, month, 1).getDay() || 7;
  const days = new Date(year, month+1, 0).getDate();

  for (let i=1; i<first; i++) {
    const d = document.createElement("div");
    cal.appendChild(d);
  }

  for (let d=1; d<=days; d++) {
    const key = `${year}-${String(month+1).padStart(2,0)}-${String(d).padStart(2,0)}`;
    const cnt = storage.daily[key] || 0;
    const el = document.createElement("div");
    el.classList.add("calendar-day");
    el.textContent = d;
    if (cnt >= 10 && cnt <20) el.classList.add("day-10");
    if (cnt >=20 && cnt <30) el.classList.add("day-20");
    if (cnt >=30) el.classList.add("day-30");
    cal.appendChild(el);
  }
}

// ==========================================
// 启动
// ==========================================
loadAll().then(() => {
  document.querySelectorAll("[onclick^='go']").forEach(x => {
    if (x.getAttribute("onclick") === "go('stats')") {
      x.onclick = () => { renderStats(); go('stats'); }
    }
  });
});
</script>
</body>
</html>
